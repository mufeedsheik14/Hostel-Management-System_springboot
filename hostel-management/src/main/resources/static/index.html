<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hostel Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; color: #222; }

        .header {
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #fff; padding: 18px 32px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .header h1 { font-size: 1.5rem; letter-spacing: 1px; }
        .header .sub { font-size: 0.85rem; opacity: 0.75; }
        #logoutBtn {
            display: none; background: #ef5350; color: #fff; border: none;
            padding: 8px 20px; border-radius: 6px; cursor: pointer;
            font-size: 0.9rem; font-weight: 600;
        }
        #logoutBtn:hover { background: #c62828; }

        .container { max-width: 900px; margin: 40px auto; padding: 0 16px; }

        /* Screen switching */
        .screen { display: none; }
        .screen.active { display: block; }
        #roleScreen.active { display: block; text-align: center; }

        #roleScreen h2 { margin-bottom: 28px; font-size: 1.4rem; color: #1a237e; }
        .role-cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
        .role-card {
            background: #fff; border-radius: 14px; padding: 36px 32px; width: 220px;
            cursor: pointer; box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            transition: transform 0.18s, box-shadow 0.18s; border: 2px solid transparent;
        }
        .role-card:hover { transform: translateY(-4px); box-shadow: 0 6px 24px rgba(0,0,0,0.15); border-color: #3949ab; }
        .role-card .icon { font-size: 2.8rem; margin-bottom: 14px; }
        .role-card h3 { font-size: 1.1rem; color: #1a237e; }
        .role-card p { font-size: 0.8rem; color: #666; margin-top: 6px; }

        .card { background: #fff; border-radius: 14px; padding: 36px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .card h2 { font-size: 1.3rem; color: #1a237e; margin-bottom: 22px; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1.5px solid #c5cae9;
            border-radius: 8px; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #3949ab; }

        .btn { background: #1a237e; color: #fff; border: none; padding: 11px 28px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #283593; }
        .btn-sm { padding: 6px 14px; font-size: 0.82rem; border-radius: 6px; }
        .btn-danger { background: #ef5350; } .btn-danger:hover { background: #c62828; }
        .btn-success { background: #388e3c; } .btn-success:hover { background: #1b5e20; }
        .btn-warn { background: #f57c00; } .btn-warn:hover { background: #e65100; }

        .back-link { display: inline-block; margin-bottom: 20px; color: #3949ab; cursor: pointer; font-size: 0.9rem; text-decoration: underline; }

        .dash-title { font-size: 1.3rem; color: #1a237e; margin-bottom: 20px; font-weight: 700; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 28px; }
        .menu-btn { background: #fff; border: 2px solid #c5cae9; border-radius: 10px; padding: 18px 12px; cursor: pointer; text-align: center; font-size: 0.9rem; color: #1a237e; font-weight: 600; transition: all 0.18s; }
        .menu-btn:hover { background: #1a237e; color: #fff; border-color: #1a237e; }
        .menu-btn .icon { font-size: 1.6rem; display: block; margin-bottom: 8px; }

        #panelArea { display: none; margin-top: 16px; }
        .panel-title { font-size: 1.1rem; color: #1a237e; margin-bottom: 18px; font-weight: 700; border-bottom: 2px solid #e8eaf6; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.88rem; }
        th { background: #1a237e; color: #fff; padding: 10px 12px; text-align: left; }
        td { padding: 9px 12px; border-bottom: 1px solid #e8eaf6; }
        tr:nth-child(even) td { background: #f5f5f5; }
        tr:hover td { background: #e8eaf6; }

        .alert { padding: 12px 18px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
        .alert.success { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
        .alert.error   { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }

        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 700; }
        .badge.pending  { background: #fff3e0; color: #e65100; }
        .badge.resolved { background: #e8f5e9; color: #1b5e20; }
        .badge.paid     { background: #e8f5e9; color: #1b5e20; }
        .badge.notpaid  { background: #ffebee; color: #b71c1c; }
        .badge.avail    { background: #e8f5e9; color: #1b5e20; }
        .badge.full     { background: #ffebee; color: #b71c1c; }

        .profile-box { background: #e8eaf6; border-radius: 10px; padding: 22px 28px; margin-bottom: 18px; }
        .profile-box h3 { color: #1a237e; margin-bottom: 12px; }
        .profile-row { display: flex; gap: 20px; margin-bottom: 8px; flex-wrap: wrap; }
        .profile-item { font-size: 0.9rem; }
        .profile-item span { font-weight: 700; }
        a { color: #1a237e; }

        @media(max-width:600px) {
            .role-cards { flex-direction: column; align-items: center; }
            .menu-grid { grid-template-columns: 1fr 1fr; }
            th, td { padding: 7px 8px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <div class="header h1">🏨 Hostel Management System</div>
        <div class="sub">Spring Boot · SQLite · REST API</div>
    </div>
    <button id="logoutBtn" onclick="logout()">Logout</button>
</div>

<div class="container">

    <!-- ROLE SELECTION -->
    <div id="roleScreen" class="screen active">
        <h2>Select Your Role</h2>
        <div class="role-cards">
            <div class="role-card" onclick="showLogin('admin')">
                <div class="icon">🔐</div>
                <h3>Administrator</h3>
                <p>Manage students</p>
            </div>
            <div class="role-card" onclick="showLogin('warden')">
                <div class="icon">🏠</div>
                <h3>Warden</h3>
                <p>Rooms &amp; complaints</p>
            </div>
            <div class="role-card" onclick="showLogin('student')">
                <div class="icon">🎓</div>
                <h3>Student</h3>
                <p>Profile, fee, complaints</p>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="loginScreen" class="screen">
        <span class="back-link" onclick="showRole()">&#8592; Back</span>
        <div class="card">
            <h2 id="loginTitle">Login</h2>
            <div id="loginAlert" class="alert"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Enter username"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter password"/>
            </div>
            <button class="btn" onclick="doLogin()">Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashScreen" class="screen">
        <div class="dash-title" id="dashTitle"></div>
        <div id="menuArea" class="menu-grid"></div>
        <div id="panelArea">
            <div class="card">
                <div class="panel-title" id="panelTitle"></div>
                <div id="panelAlert" class="alert"></div>
                <div id="panelContent"></div>
            </div>
        </div>
    </div>

</div>

<script>
// ====================== STATE ======================
var currentRole = '';
var currentStudentId = null;

// ====================== SCREEN SWITCHING ======================
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
        s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
}

function showRole() {
    currentRole = '';
    currentStudentId = null;
    document.getElementById('logoutBtn').style.display = 'none';
    showScreen('roleScreen');
}

function showLogin(role) {
    currentRole = role;
    var titles = { admin: 'Administrator Login', warden: 'Warden Login', student: 'Student Login' };
    document.getElementById('loginTitle').textContent = titles[role];
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    hideAlert('loginAlert');
    showScreen('loginScreen');
}

function showDash(role) {
    document.getElementById('logoutBtn').style.display = 'inline-block';
    document.getElementById('panelArea').style.display = 'none';

    var title = '';
    var menus = [];

    if (role === 'admin') {
        title = '🔐 Administrator Dashboard';
        menus = [
            { icon: '➕', label: 'Add Student',    fn: 'showAddStudent()' },
            { icon: '👥', label: 'View Students',  fn: 'loadViewStudents()' },
            { icon: '🗑️', label: 'Remove Student', fn: 'showRemoveStudent()' },
            { icon: '🔍', label: 'Search Student', fn: 'showSearchStudent()' }
        ];
    } else if (role === 'warden') {
        title = '🏠 Warden Dashboard';
        menus = [
            { icon: '🛏️', label: 'Allocate Room',     fn: 'showAllocateRoom()' },
            { icon: '📋', label: 'View Complaints',   fn: 'loadViewComplaints()' },
            { icon: '✅', label: 'Resolve Complaint', fn: 'showResolveComplaint()' },
            { icon: '🏠', label: 'View All Rooms',    fn: 'loadViewRooms()' },
            { icon: '🔄', label: 'Change Room',       fn: 'showChangeRoom()' }
        ];
    } else if (role === 'student') {
        title = '🎓 Student Dashboard';
        menus = [
            { icon: '👤', label: 'View Profile',       fn: 'loadProfile()' },
            { icon: '💰', label: 'Pay Fee',            fn: 'showPayFee()' },
            { icon: '📝', label: 'Register Complaint', fn: 'showRegisterComplaint()' },
            { icon: '🔍', label: 'Complaint Status',   fn: 'loadComplaintStatus()' }
        ];
    }

    document.getElementById('dashTitle').textContent = title;
    document.getElementById('menuArea').innerHTML = menus.map(function(m) {
        return '<div class="menu-btn" onclick="' + m.fn + '"><span class="icon">' + m.icon + '</span>' + m.label + '</div>';
    }).join('');

    showScreen('dashScreen');
}

function logout() { showRole(); }

// ====================== ALERT HELPERS ======================
function showAlert(id, type, msg) {
    var el = document.getElementById(id);
    el.className = 'alert ' + type;
    el.textContent = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 6000);
}
function hideAlert(id) { document.getElementById(id).style.display = 'none'; }

function setPanelTitle(t) {
    document.getElementById('panelTitle').textContent = t;
    document.getElementById('panelArea').style.display = 'block';
    hideAlert('panelAlert');
}
function setPanel(html) { document.getElementById('panelContent').innerHTML = html; }
function v(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }

// ====================== API HELPERS ======================
async function apiGet(url) {
    var r = await fetch(url);
    var d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Request failed');
    return d;
}
async function apiPost(url, body) {
    var r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Request failed');
    return d;
}
async function apiPut(url, body) {
    var r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    var d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Request failed');
    return d;
}
async function apiDelete(url) {
    var r = await fetch(url, { method: 'DELETE' });
    var d = await r.json();
    if (!r.ok) throw new Error(d.message || 'Request failed');
    return d;
}

// ====================== LOGIN ======================
async function doLogin() {
    var username = v('loginUser');
    var password = v('loginPass');
    if (!username || !password) { showAlert('loginAlert', 'error', 'Please enter username and password.'); return; }
    var urls = { admin: '/api/admin/login', warden: '/api/warden/login', student: '/api/student/login' };
    try {
        var data = await apiPost(urls[currentRole], { username: username, password: password });
        if (currentRole === 'student') currentStudentId = data.studentId;
        showDash(currentRole);
    } catch(e) { showAlert('loginAlert', 'error', e.message); }
}

// Enter key support
document.addEventListener('DOMContentLoaded', function() {
    ['loginUser','loginPass'].forEach(function(id) {
        document.getElementById(id).addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doLogin();
        });
    });
});

// ====================== ADMIN: ADD STUDENT ======================
function showAddStudent() {
    setPanelTitle('➕ Add Student');
    setPanel(
        '<div class="form-group"><label>Student Name</label><input id="sName" placeholder="Full name"/></div>' +
        '<div class="form-group"><label>Student ID</label><input id="sId" type="number" placeholder="Numeric ID"/></div>' +
        '<div class="form-group"><label>Department</label><input id="sDept" placeholder="e.g. Computer Science"/></div>' +
        '<div class="form-group"><label>Year</label><select id="sYear"><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select></div>' +
        '<div class="form-group"><label>Username</label><input id="sUser" placeholder="Login username"/></div>' +
        '<div class="form-group"><label>Password</label><input id="sPass" type="password" placeholder="Login password"/></div>' +
        '<button class="btn" onclick="doAddStudent()">Add Student</button>'
    );
}
async function doAddStudent() {
    var name=v('sName'), id=v('sId'), dept=v('sDept'), year=v('sYear'), username=v('sUser'), password=v('sPass');
    if (!name||!id||!dept||!username||!password) { showAlert('panelAlert','error','All fields are required.'); return; }
    try {
        var data = await apiPost('/api/admin/students', { name:name, id:parseInt(id), department:dept, year:parseInt(year), username:username, password:password });
        showAlert('panelAlert','success', data.message);
        ['sName','sId','sDept','sUser','sPass'].forEach(function(x){ document.getElementById(x).value=''; });
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== ADMIN: VIEW STUDENTS ======================
async function loadViewStudents() {
    setPanelTitle('👥 All Students');
    setPanel('<p>Loading...</p>');
    try {
        var students = await apiGet('/api/admin/students');
        if (!students.length) { setPanel('<p>No students enrolled yet.</p>'); return; }
        var rows = students.map(function(s) {
            return '<tr><td>'+s.studentId+'</td><td>'+s.name+'</td><td>'+s.department+'</td><td>'+s.year+'</td><td>'+(s.roomNo===0?'Not Assigned':s.roomNo)+'</td><td><span class="badge '+(s.feePaid>0?'paid':'notpaid')+'">'+(s.feePaid>0?'PAID':'NOT PAID')+'</span></td><td>'+s.username+'</td></tr>';
        }).join('');
        setPanel('<table><thead><tr><th>ID</th><th>Name</th><th>Dept</th><th>Year</th><th>Room</th><th>Fee</th><th>Username</th></tr></thead><tbody>'+rows+'</tbody></table>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== ADMIN: REMOVE STUDENT ======================
function showRemoveStudent() {
    setPanelTitle('🗑️ Remove Student');
    setPanel('<div class="form-group"><label>Student ID</label><input id="removeId" type="number" placeholder="Enter Student ID"/></div><button class="btn btn-danger" onclick="doRemoveStudent()">Remove Student</button>');
}
async function doRemoveStudent() {
    var id=v('removeId');
    if (!id) { showAlert('panelAlert','error','Enter a Student ID.'); return; }
    if (!confirm('Are you sure?')) return;
    try {
        var data = await apiDelete('/api/admin/students/'+id);
        showAlert('panelAlert','success',data.message);
        document.getElementById('removeId').value='';
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== ADMIN: SEARCH STUDENT (NEW) ======================
function showSearchStudent() {
    setPanelTitle('🔍 Search Student by ID');
    setPanel('<div class="form-group"><label>Student ID</label><input id="searchId" type="number" placeholder="Enter Student ID"/></div><button class="btn" onclick="doSearchStudent()">Search</button><div id="searchResult" style="margin-top:20px"></div>');
}
async function doSearchStudent() {
    var id=v('searchId');
    if (!id) { showAlert('panelAlert','error','Enter a Student ID.'); return; }
    try {
        var s = await apiGet('/api/admin/students/'+id);
        document.getElementById('searchResult').innerHTML =
            '<div class="profile-box"><h3>👤 '+s.name+'</h3>'+
            '<div class="profile-row"><div class="profile-item">ID: <span>'+s.studentId+'</span></div><div class="profile-item">Department: <span>'+s.department+'</span></div><div class="profile-item">Year: <span>'+s.year+'</span></div><div class="profile-item">Username: <span>'+s.username+'</span></div></div>'+
            '<div class="profile-row"><div class="profile-item">Room: <span>'+(s.roomNo===0?'Not Assigned':s.roomNo)+'</span></div><div class="profile-item">Total Fee: <span>&#8377;'+s.totalFee.toLocaleString()+'</span></div><div class="profile-item">Fee Status: <span class="badge '+(s.feePaid>0?'paid':'notpaid')+'">'+(s.feePaid>0?'PAID':'NOT PAID')+'</span></div></div></div>';
    } catch(e) { document.getElementById('searchResult').innerHTML=''; showAlert('panelAlert','error',e.message); }
}

// ====================== WARDEN: ALLOCATE ROOM ======================
function showAllocateRoom() {
    setPanelTitle('🛏️ Allocate Room');
    setPanel('<div class="form-group"><label>Student ID</label><input id="arStudentId" type="number" placeholder="Student ID"/></div><div class="form-group"><label>Room Number (1-20)</label><input id="arRoomNo" type="number" min="1" max="20" placeholder="1-20"/></div><button class="btn" onclick="doAllocateRoom()">Allocate Room</button>');
}
async function doAllocateRoom() {
    var studentId=v('arStudentId'), roomNo=v('arRoomNo');
    if (!studentId||!roomNo) { showAlert('panelAlert','error','Both fields required.'); return; }
    try {
        var data = await apiPost('/api/warden/allocate-room', { studentId:parseInt(studentId), roomNo:parseInt(roomNo) });
        showAlert('panelAlert','success',data.message);
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== WARDEN: VIEW COMPLAINTS ======================
async function loadViewComplaints() {
    setPanelTitle('📋 All Complaints');
    setPanel('<p>Loading...</p>');
    try {
        var complaints = await apiGet('/api/warden/complaints');
        if (!complaints.length) { setPanel('<p>No complaints registered.</p>'); return; }
        var rows = complaints.map(function(c) {
            return '<tr><td>'+c.complaintId+'</td><td>'+c.studentId+'</td><td>'+c.description+'</td><td><span class="badge '+(c.resolved?'resolved':'pending')+'">'+(c.resolved?'Resolved':'Pending')+'</span></td><td>'+(c.resolved?'&#8212;':'<button class="btn btn-success btn-sm" onclick="quickResolve('+c.complaintId+')">Resolve</button>')+'</td></tr>';
        }).join('');
        setPanel('<table><thead><tr><th>ID</th><th>Student ID</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}
async function quickResolve(id) {
    try {
        var data = await apiPut('/api/warden/complaints/'+id+'/resolve', {});
        showAlert('panelAlert','success',data.message);
        loadViewComplaints();
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== WARDEN: RESOLVE COMPLAINT ======================
function showResolveComplaint() {
    setPanelTitle('✅ Resolve Complaint');
    setPanel('<div class="form-group"><label>Complaint ID</label><input id="resolveId" type="number" placeholder="Complaint ID"/></div><button class="btn btn-success" onclick="doResolveComplaint()">Mark as Resolved</button>');
}
async function doResolveComplaint() {
    var id=v('resolveId');
    if (!id) { showAlert('panelAlert','error','Enter Complaint ID.'); return; }
    try {
        var data = await apiPut('/api/warden/complaints/'+id+'/resolve', {});
        showAlert('panelAlert','success',data.message);
        document.getElementById('resolveId').value='';
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== WARDEN: VIEW ALL ROOMS (clickable) ======================
async function loadViewRooms() {
    setPanelTitle('🏠 All Rooms — Click a room to see its students');
    setPanel('<p>Loading...</p>');
    try {
        var rooms = await apiGet('/api/warden/rooms');
        var rows = rooms.map(function(r) {
            var avail = r.currentCount < r.capacity;
            return '<tr><td><a href="#" onclick="loadRoomStudents('+r.roomNo+'); return false;">Room '+r.roomNo+'</a></td><td>'+r.currentCount+' / '+r.capacity+'</td><td><span class="badge '+(avail?'avail':'full')+'">'+(avail?'Available':'Full')+'</span></td></tr>';
        }).join('');
        setPanel('<table><thead><tr><th>Room</th><th>Occupied</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table><div id="roomStudentsArea" style="margin-top:24px"></div>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}
async function loadRoomStudents(roomNo) {
    var area = document.getElementById('roomStudentsArea');
    if (!area) return;
    area.innerHTML = '<p>Loading students in Room '+roomNo+'...</p>';
    try {
        var students = await apiGet('/api/warden/rooms/'+roomNo+'/students');
        if (!students.length) { area.innerHTML='<div class="profile-box"><h3>🏠 Room '+roomNo+'</h3><p>No students in this room.</p></div>'; return; }
        var rows = students.map(function(s){ return '<tr><td>'+s.studentId+'</td><td>'+s.name+'</td><td>'+s.department+'</td><td>'+s.year+'</td></tr>'; }).join('');
        area.innerHTML='<div class="panel-title">🏠 Students in Room '+roomNo+'</div><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Year</th></tr></thead><tbody>'+rows+'</tbody></table>';
    } catch(e) { area.innerHTML=''; showAlert('panelAlert','error',e.message); }
}

// ====================== WARDEN: CHANGE ROOM (NEW) ======================
function showChangeRoom() {
    setPanelTitle('🔄 Change Student Room');
    setPanel('<div class="form-group"><label>Student ID</label><input id="crStudentId" type="number" placeholder="Enter Student ID"/></div><div class="form-group"><label>New Room Number (1-20)</label><input id="crNewRoom" type="number" min="1" max="20" placeholder="1-20"/></div><button class="btn btn-warn" onclick="doChangeRoom()">Change Room</button>');
}
async function doChangeRoom() {
    var studentId=v('crStudentId'), newRoomNo=v('crNewRoom');
    if (!studentId||!newRoomNo) { showAlert('panelAlert','error','Both fields are required.'); return; }
    try {
        var data = await apiPut('/api/warden/change-room', { studentId:parseInt(studentId), newRoomNo:parseInt(newRoomNo) });
        showAlert('panelAlert','success',data.message);
        document.getElementById('crStudentId').value='';
        document.getElementById('crNewRoom').value='';
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== STUDENT: VIEW PROFILE ======================
async function loadProfile() {
    setPanelTitle('👤 My Profile');
    setPanel('<p>Loading...</p>');
    try {
        var s = await apiGet('/api/student/'+currentStudentId+'/profile');
        setPanel('<div class="profile-box"><h3>👤 '+s.name+'</h3><div class="profile-row"><div class="profile-item">ID: <span>'+s.studentId+'</span></div><div class="profile-item">Department: <span>'+s.department+'</span></div><div class="profile-item">Year: <span>'+s.year+'</span></div><div class="profile-item">Room: <span>'+(s.roomNo===0?'Not Assigned':s.roomNo)+'</span></div></div><div class="profile-row"><div class="profile-item">Total Fee: <span>&#8377;'+s.totalFee.toLocaleString()+'</span></div><div class="profile-item">Fee Paid: <span>&#8377;'+s.feePaid.toLocaleString()+'</span></div><div class="profile-item">Status: <span class="badge '+(s.feePaid>0?'paid':'notpaid')+'">'+(s.feePaid>0?'PAID':'NOT PAID')+'</span></div></div></div>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== STUDENT: PAY FEE ======================
async function showPayFee() {
    setPanelTitle('💰 Pay Fee');
    setPanel('<p>Loading...</p>');
    try {
        var s = await apiGet('/api/student/'+currentStudentId+'/profile');
        setPanel('<div class="profile-box" style="margin-bottom:20px"><div class="profile-row"><div class="profile-item">Total Fee: <span>&#8377;'+s.totalFee.toLocaleString()+'</span></div><div class="profile-item">Fee Paid: <span>&#8377;'+s.feePaid.toLocaleString()+'</span></div><div class="profile-item">Status: <span class="badge '+(s.feePaid>0?'paid':'notpaid')+'">'+(s.feePaid>0?'PAID':'NOT PAID')+'</span></div></div></div><div class="form-group"><label>Enter Amount (&#8377;)</label><input id="feeAmt" type="number" placeholder="e.g. 50000"/></div><button class="btn btn-success" onclick="doPayFee()">Pay Fee</button>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}
async function doPayFee() {
    var amount=v('feeAmt');
    if (!amount) { showAlert('panelAlert','error','Enter an amount.'); return; }
    try {
        var data = await apiPost('/api/student/'+currentStudentId+'/pay-fee', { amount:parseFloat(amount) });
        showAlert('panelAlert','success',data.message);
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== STUDENT: REGISTER COMPLAINT ======================
function showRegisterComplaint() {
    setPanelTitle('📝 Register Complaint');
    setPanel('<div class="form-group"><label>Complaint Description</label><textarea id="compDesc" rows="4" placeholder="Describe your complaint..."></textarea></div><button class="btn btn-warn" onclick="doRegisterComplaint()">Submit Complaint</button>');
}
async function doRegisterComplaint() {
    var desc=v('compDesc');
    if (!desc) { showAlert('panelAlert','error','Enter a description.'); return; }
    try {
        var data = await apiPost('/api/student/'+currentStudentId+'/complaints', { description:desc });
        showAlert('panelAlert','success',data.message);
        document.getElementById('compDesc').value='';
    } catch(e) { showAlert('panelAlert','error',e.message); }
}

// ====================== STUDENT: COMPLAINT STATUS ======================
async function loadComplaintStatus() {
    setPanelTitle('🔍 My Complaints');
    setPanel('<p>Loading...</p>');
    try {
        var list = await apiGet('/api/student/'+currentStudentId+'/complaints');
        if (!list.length) { setPanel('<p>No complaints registered yet.</p>'); return; }
        var rows = list.map(function(c){ return '<tr><td>'+c.complaintId+'</td><td>'+c.description+'</td><td><span class="badge '+(c.resolved?'resolved':'pending')+'">'+(c.resolved?'Resolved':'Pending')+'</span></td></tr>'; }).join('');
        setPanel('<table><thead><tr><th>ID</th><th>Description</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table>');
    } catch(e) { showAlert('panelAlert','error',e.message); }
}
</script>
