spring.datasource.url=jdbc:sqlite:hostel.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Initialize rooms on startup
app.rooms.count=20
app.rooms.capacity=2

# Admin & Warden credentials (same as original)
app.admin.username=admin
app.admin.password=admin123
app.warden.username=warden
app.warden.password=warden123

# Total fee (same as original)
app.fee.total=50000

server.port=8080
spring.mvc.pathmatch.use-suffix-pattern=false
